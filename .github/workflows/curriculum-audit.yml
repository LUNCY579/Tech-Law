name: Curriculum structural audit

on:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:
    paths:
      - '**/*.md'
      - 'quality/*.json'
      - 'research/**/*.csv'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/curriculum-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit curriculum structure
        run: python3 scripts/audit_curriculum.py